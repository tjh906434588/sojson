<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <title>Netlify Forms</title>
  </head>
  <body>
    <form name="suggestion" method="POST" data-netlify="true" hidden>
      <input type="hidden" name="form-name" value="suggestion" />
      <input type="text" name="feedback-type" />
      <input type="text" name="tool-name" />
      <input type="text" name="rating" />
      <textarea name="feedback-content"></textarea>
      <input type="text" name="email" />
    </form>
  </body>
</html>
